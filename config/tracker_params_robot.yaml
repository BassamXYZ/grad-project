detect_can:
  ros__parameters:
    x_min: 0
    x_max: 100
    y_min: 15
    y_max: 80
    h_min: 65        # adjust for your can color
    h_max: 100
    s_min: 35
    s_max: 255
    v_min: 50
    v_max: 105
    sz_min: 10       # minimum width (as % of image width) to consider
    sz_max: 90       # maximum width (as % of image width)

detect_can_3d:
  ros__parameters:
    h_fov: 0.6745
    aspect_ratio: 0.5625
    camera_frame: "camera_link_optical"

follow:
  ros__parameters:
    rcv_timeout_secs: 1.0
    angular_chase_multiplier: 0.7
    forward_chase_speed: 0.4
    search_angular_speed: 6.0
    max_size_thresh: 0.3
    filter_value: 0.9


